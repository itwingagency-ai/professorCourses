services:
  mongo:
    image: mongo:7
    container_name: lms_mongo_prod
    restart: unless-stopped
    # No host port — only accessible within lms_prod_network
    volumes:
      - lms_mongo_prod_data:/data/db
    networks:
      - lms_prod_network

  redis:
    image: redis:7-alpine
    container_name: lms_redis_prod
    restart: unless-stopped
    # No host port — only accessible within lms_prod_network
    networks:
      - lms_prod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lms_backend_prod
    restart: unless-stopped
    # 8010 chosen to avoid conflict with other projects on this VPS
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - mongo
      - redis
    networks:
      - lms_prod_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lms_frontend_prod
    restart: unless-stopped
    # 3010 chosen to avoid conflict with other projects on this VPS
    ports:
      - "127.0.0.1:3010:3000"
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - backend
    networks:
      - lms_prod_network

volumes:
  lms_mongo_prod_data:

networks:
  lms_prod_network:
    driver: bridge
